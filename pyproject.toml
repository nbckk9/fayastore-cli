[project]
name = "fayastore-cli"
version = "0.1.0"
description = "A CLI and TUI tool to query and manage Firestore data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "google-cloud-firestore>=2.14.0",
    "textual>=0.47.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
fayastore = "fayastore_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fayastore_cli"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
